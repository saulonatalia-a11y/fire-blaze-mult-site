<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FIRE BLAZE • Configuração</title><link rel="stylesheet" href="styles.css"></head><body><div class="login-wrap"><div class="login-card"><span class="orb big"></span><span class="eyebrow">CONFIGURAÇÃO ÚNICA</span><h1>Criar administrador</h1><p>Esta tela funciona somente enquanto nenhum administrador existir.</p><form id="f"><label>Código de configuração<input id="code" required></label><label>E-mail do administrador<input id="email" type="email" required></label><label>Senha (mínimo 10 caracteres)<input id="password" type="password" minlength="10" required></label><button class="btn primary">Criar administrador</button><p id="msg" class="msg"></p></form></div></div><script type="module">import{SUPABASE_KEY,FUNCTIONS}from'./config.js';const f=document.querySelector('#f'),m=document.querySelector('#msg');f.onsubmit=async e=>{e.preventDefault();m.textContent='Criando...';const r=await fetch(`${FUNCTIONS}/setup-admin`,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({setup_code:code.value,email:email.value,password:password.value})});const j=await r.json();if(j.ok){m.style.color='#38e59c';m.textContent='Administrador criado. Abrindo login...';setTimeout(()=>location.href='admin.html',1200)}else m.textContent=j.error||'Falha.'}</script></body></html>
