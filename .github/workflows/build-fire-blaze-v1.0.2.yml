name: Gerar FIRE BLAZE Mult V1.0.2 Setup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Baixar ZIP V1.0.2 da Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          New-Item -ItemType Directory -Force -Path installer\payload | Out-Null
          gh release download "v1.0.2" --pattern "FIRE-BLAZE-Mult-V1.0.2-FINAL-GERADOR.zip" --dir build
          Expand-Archive -LiteralPath "build\FIRE-BLAZE-Mult-V1.0.2-FINAL-GERADOR.zip" -DestinationPath "installer\payload" -Force

      - name: Localizar executavel principal
        shell: pwsh
        run: |
          $root = (Resolve-Path "installer\payload").Path
          $exe = Get-ChildItem $root -Recurse -Filter "FIRE BLAZE Mult.exe" | Select-Object -First 1
          if (-not $exe) { throw "FIRE BLAZE Mult.exe nao encontrado no ZIP V1.0.2." }
          if ($exe.DirectoryName -ne $root) {
            $sourceDir = $exe.DirectoryName
            Get-ChildItem $sourceDir -Force | ForEach-Object {
              Move-Item -LiteralPath $_.FullName -Destination $root -Force
            }
          }

      - name: Confirmar versao do payload
        shell: pwsh
        run: |
          $package = Get-ChildItem "installer\payload" -Recurse -Filter "package.json" | Select-Object -First 1
          if (-not $package) { throw "package.json nao encontrado no payload." }
          $json = Get-Content $package.FullName -Raw | ConvertFrom-Json
          Write-Host "Versao encontrada no ZIP: $($json.version)"
          if ($json.version -ne "1.0.2") { throw "ERRO: ZIP nao e V1.0.2. Geracao cancelada." }

      - name: Instalar NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress

      - name: Compilar Setup V1.0.2
        shell: pwsh
        run: |
          Set-Location installer
          & "C:\Program Files (x86)\NSIS\makensis.exe" "fire-blaze-mult.nsi"
          if ($LASTEXITCODE -ne 0) { throw "NSIS retornou erro $LASTEXITCODE." }
          if (-not (Test-Path "FIRE-BLAZE-Mult-Setup.exe")) { throw "Setup nao foi gerado." }
          $hash = (Get-FileHash "FIRE-BLAZE-Mult-Setup.exe" -Algorithm SHA256).Hash
          Write-Host "SHA256 NOVO SETUP: $hash"

      - name: Publicar Setup V1.0.2
        uses: actions/upload-artifact@v4
        with:
          name: FIRE-BLAZE-Mult-V1.0.2-Setup
          path: installer/FIRE-BLAZE-Mult-Setup.exe
          if-no-files-found: error
          retention-days: 30
