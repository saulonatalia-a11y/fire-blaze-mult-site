name: FIRE BLAZE MULT Portable
on:
  push:
    paths:
      - 'fire-blaze-mult/**'
      - '.github/workflows/fire-blaze-portable.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fire-blaze-mult
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fire-blaze-mult/package-lock.json
      - run: npm install
      - run: npm run portable
      - uses: actions/upload-artifact@v4
        with:
          name: FIRE-BLAZE-MULT-PORTABLE
          path: fire-blaze-mult/dist/FIRE-BLAZE-MULT-PORTABLE.exe
          retention-days: 30
